<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 — Server Error — Waste Wise Bengaluru</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
<div class="error-wrapper">
  <div style="font-size:4rem;margin-bottom:8px;">⚠️</div>
  <div class="error-code" style="color:var(--danger);">500</div>
  <div class="error-msg">Internal Server Error</div>
  <div class="error-hint">
    Something went wrong on our end. The technical team has been notified.
  </div>
  <div class="flex gap-3" style="justify-content:center;">
    <a href="{{ url_for('citizen.dashboard') if current_user.is_authenticated and not current_user.is_admin() else url_for('admin.dashboard') if current_user.is_authenticated and current_user.is_admin() else url_for('auth.login') }}"
       class="btn btn-primary">🏠 Go Home</a>
    <a href="javascript:location.reload()" class="btn btn-secondary">🔄 Retry</a>
  </div>
  <div style="margin-top:16px;">
    <details style="font-size:.78rem;color:var(--text-muted);cursor:pointer;">
      <summary>Technical details</summary>
      <pre style="margin-top:10px;text-align:left;background:#f9fafb;padding:12px;border-radius:6px;font-size:.72rem;white-space:pre-wrap;max-width:500px;">
{{ error if error is defined else 'No additional information available.' }}
      </pre>
    </details>
  </div>
  <div style="margin-top:24px;color:var(--text-muted);font-size:.78rem;">
    Waste Wise Bengaluru — BBMP Smart City Initiative
  </div>
</div>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
